<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>404 — Page Not Found | StillLoud</title>

  <!-- Google Fonts: matches main site -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Poppins:wght@700;800;900&display=swap"
    rel="stylesheet">

  <style>
    /* ── Design tokens (mirrors style.css) ── */
    :root {
      --color-primary:  #8338EC;
      --color-secondary:#FB5607;
      --color-dark:     #212529;
      --color-dark-2:   #2D3136;
      --color-light:    #E9ECEF;
      --color-white:    #FFFFFF;
      --color-gray:     #8B8C91;
      --gradient-primary: linear-gradient(135deg, #8338EC 0%, #A855F7 100%);
      --gradient-orange:  linear-gradient(135deg, #FB5607 0%, #FF7A29 100%);
      --font-heading: 'Poppins',  sans-serif;
      --font-body:    'Manrope',  sans-serif;
      --radius-lg: 16px;
      --radius-pill: 999px;
    }

    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Page shell ── */
    html, body {
      height: 100%;
      background-color: var(--color-dark);
      color: var(--color-light);
      font-family: var(--font-body);
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem 1.25rem;
      position: relative;
    }

    /* ── Ambient glow orbs (background decoration) ── */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
    }
    body::before {
      width: 520px;
      height: 520px;
      background: rgba(131, 56, 236, 0.18);
      top: -120px;
      right: -100px;
    }
    body::after {
      width: 400px;
      height: 400px;
      background: rgba(251, 86, 7, 0.14);
      bottom: -80px;
      left: -80px;
    }

    /* ── Card container ── */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(233, 236, 239, 0.10);
      border-radius: var(--radius-lg);
      padding: clamp(2.5rem, 6vw, 5rem) clamp(2rem, 8vw, 6rem);
      text-align: center;
      max-width: 600px;
      width: 100%;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
      animation: fadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(32px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    /* ── 404 number ── */
    .error-code {
      font-family: var(--font-heading);
      font-size: clamp(5rem, 20vw, 9rem);
      font-weight: 900;
      line-height: 1;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
      margin-bottom: 0.2em;
      /* floating pulse */
      animation: floatPulse 3.5s ease-in-out infinite;
    }

    @keyframes floatPulse {
      0%, 100% { transform: translateY(0);    filter: drop-shadow(0 0 18px rgba(131,56,236,.55)); }
      50%       { transform: translateY(-8px); filter: drop-shadow(0 0 30px rgba(131,56,236,.80)); }
    }

    /* ── Orange accent line ── */
    .accent-line {
      width: 60px;
      height: 4px;
      background: var(--gradient-orange);
      border-radius: var(--radius-pill);
      margin: 0 auto 1.75rem;
    }

    /* ── Heading ── */
    .error-title {
      font-family: var(--font-heading);
      font-size: clamp(1.4rem, 4vw, 2rem);
      font-weight: 800;
      color: var(--color-white);
      margin-bottom: 0.75rem;
    }

    /* ── Description ── */
    .error-desc {
      font-size: clamp(0.9rem, 2.5vw, 1.05rem);
      color: var(--color-gray);
      line-height: 1.7;
      max-width: 380px;
      margin: 0 auto 2.5rem;
    }
    .error-desc span {
      color: var(--color-light);
      font-weight: 600;
    }

    /* ── Button group ── */
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 2rem;
      border-radius: var(--radius-pill);
      font-family: var(--font-body);
      font-size: 0.95rem;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.25s ease, box-shadow 0.25s ease, opacity 0.25s ease;
      letter-spacing: 0.02em;
    }
    .btn:hover  { transform: translateY(-3px); }
    .btn:active { transform: translateY(0);    }

    /* Primary — gradient purple */
    .btn-primary {
      background: var(--gradient-primary);
      color: var(--color-white);
      box-shadow: 0 8px 24px rgba(131, 56, 236, 0.40);
    }
    .btn-primary:hover {
      box-shadow: 0 12px 32px rgba(131, 56, 236, 0.60);
    }

    /* Secondary — ghost */
    .btn-ghost {
      background: transparent;
      color: var(--color-light);
      border: 1.5px solid rgba(233, 236, 239, 0.25);
    }
    .btn-ghost:hover {
      border-color: rgba(233, 236, 239, 0.55);
      background: rgba(255, 255, 255, 0.05);
    }

    /* ── Branding watermark ── */
    .brand-watermark {
      position: relative;
      z-index: 1;
      margin-top: 2.5rem;
      font-family: var(--font-heading);
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(139, 140, 145, 0.55);
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .brand-watermark a {
      color: inherit;
      text-decoration: none;
      transition: color 0.2s;
    }
    .brand-watermark a:hover { color: var(--color-primary); }

    /* ── Responsive ── */
    @media (max-width: 480px) {
      .btn-group { flex-direction: column; align-items: center; }
      .btn       { width: 100%; max-width: 280px; justify-content: center; }
    }
  </style>
</head>

<body>

  <div class="card" role="main">
    <!-- Big 404 -->
    <p class="error-code" aria-label="Error 404">404</p>

    <!-- Accent rule -->
    <div class="accent-line" aria-hidden="true"></div>

    <!-- Heading -->
    <h1 class="error-title">Page Not Found</h1>

    <!-- Friendly copy -->
    <p class="error-desc">
      Looks like this page took a bold leap into the void.<br>
      The URL <span id="bad-url"></span> doesn't exist — but our other pages are loud and ready.
    </p>

    <!-- CTA buttons -->
    <div class="btn-group">
      <a href="/" class="btn btn-primary" id="btn-home">
        ← Go Home
      </a>
      <button class="btn btn-ghost" id="btn-back" onclick="history.length > 1 ? history.back() : window.location.href='/'">
        Go Back
      </button>
    </div>
  </div>

  <!-- Subtle brand signature -->
  <p class="brand-watermark">
    <a href="/">StillLoud</a> — Elevating Brands with Bold Design
  </p>

  <script>
    // Inject the bad URL so users know exactly what 404'd
    (function () {
      var el = document.getElementById('bad-url');
      var path = window.location.pathname;
      if (path && path !== '/404.html') {
        el.textContent = '"' + path + '"';
      } else {
        el.textContent = 'you tried to visit';
      }
    })();
  </script>

</body>
</html>
